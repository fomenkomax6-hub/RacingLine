<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com">
<link rel="stylesheet" href="racingline.css">
<link rel="stylesheet" href="main.css">

</head>
<body>

  <header id="home">
    <!-- HOME -->


    <!-- Титульный текст-->
    <title>racing line</title>

    <!-- Навигация -->
    <nav class="topnav">
      <a href="#about" class="nav-link">About Us</a>
      <a href="#home" class="nav-link">Home</a>
      <a href="page-isnt-detected.html" class="nav-link">Subscriptions</a>
    </nav>

    <!-- Racing Line + лого -->
    <div class="main-text">
      <div class="logo" role="img">
        <span class="title-text">racing</span>
        <svg class="apex-mark" viewBox="0 0 64 48" aria-hidden="true">
          <polyline points="4,4 32,30 60,4" />
          <polyline points="4,20 32,46 60,20" />
        </svg>
        <span>line</span>
      </div>
      <p class="tagline">Get closer to speed.</p>
    </div>

    
    <!-- Серии -->

    <nav class="series-strip" aria-label="Выбор гоночной серии">
      <a href="page-isnt-detected.html" class="series-badge">
        <span class="series-name series-name--wrc"><img src="images/wrc2.png" width="40"></span>
      </a>
      <a href="page-isnt-detected.html" class="series-badge">
        <span class="series-name series-name--imsa"><img src="images/imsa.png" width="100"></span>
      </a>
      <a href="f1_about.html" class="series-badge series-badge--primary">
        <span class="series-name series-name--f1"><img src="images/f1.png" width="50"></span>
      </a>
      <a href="page-isnt-detected.html" class="series-badge">
        <span class="series-name series-name--gt3"><img src="images/gt3.png" width="50"><span>
      </a>
      <a href="page-isnt-detected.html" class="series-badge">
        <span class="series-name series-name--nascar"><img src="images/nascar.png" width="80"></span>
      </a>
    </nav>

  </header>

  <!-- ABOUT -->

  <main class="highlights" id='about'>

      <!-- Разделительные линии -->

    <div class="highlights-grid">

      <svg class="connector-lines" viewBox="0 0 600 460" preserveAspectRatio="none" aria-hidden="true">
        <path d="M 230 62 L 330 62 L 330 168" />
        <path d="M 330 168 L 330 300" />
        <circle cx="230" cy="62" r="4"/>
        <circle cx="330" cy="168" r="4"/>
        <circle cx="330" cy="300" r="4"/>
      </svg>

      <div class="stat stat-clients">
        <img src="images/clients.png" width="50">
        <svg class="stat-arrow" viewBox="0 0 40 16" aria-hidden="true">
        </svg>
        <span class="stat-number">55k</span>
        <h1 class="stat-label">clients per year</h1>
      </div>

      <!-- fans сетка -->
      <div class="media-placeholder media-placeholder--fans">
      </div>

      <!-- ontrack сетка -->
      <div class="media-placeholder media-placeholder--track">
        <img src="images/ontrack.png" width="400">
      </div>

      <div class="stat-races">
        <span class="stat-number">200</span>
        
        <!-- Декоративные линии -->
        <svg class="stat-icon stat-icon--broadcast" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="2.6"/>
          <path d="M22 10a9 9 0 0 1 0 12" fill="none" stroke-width="2.4"/>
          <path d="M26 6a15 15 0 0 1 0 20" fill="none" stroke-width="2.4"/>
        </svg>
        <span class="stat-label">races we broadcast</span>
      </div>

    </div>

    <div class="link-block">
      <h2 class="link-heading">Join our community</h2>

      <!-- Кнопка go -->

      <a href="#home" class="link-button media-placeholder media-placeholder--cta">
        <span class="link-button-label"><h1>Go</h1></span>
        <img src="images/button.png" width="900px">
      </a>
    </div>
  </main>

  <!-- Подвал -->

  <footer>
    <div class="logos-row">

    <a href="https://www.pirelli.com/global/en-ww/homepage/"><img src="pirelli.jpg" width=200></a>
    <a href="https://www.skysports.com/"><img src="skysports.webp" width=200></a>
    <a href="https://www.espn.com/"><img src="espn.png" height="50" width="200"></a>

    <p class="foot">@RacingLine                                 </p>
    </div>

  </footer>
 </body>
